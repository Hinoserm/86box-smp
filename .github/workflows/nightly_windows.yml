name: Nightly (Windows)

# Builds master for Windows x64 each night, when it has changed, and on
# demand, and publishes it as the "nightly" prerelease: a zip like upstream's
# Windows downloads, made by upstream's own build script, with the assets and
# GhostPCL added, and an installer of the same that also fetches the ROMs.
#
# This is the only workflow this repository runs. Each run switches off any
# other one, upstream's included, so an upstream merge cannot bring them back.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish as the nightly release (off: build and test only)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-windows
  cancel-in-progress: true

jobs:

  check:
    name: Check for changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.check.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Switch off the other workflows
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active")
                  | select(.path | startswith(".github/workflows/"))
                  | select(.path != ".github/workflows/nightly_windows.yml")
                  | "\(.id) \(.path)"' |
          while read -r id path; do
            echo "Switching off $path"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"
          done

      - name: Decide whether to build
        id: check
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            nightly=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null) || nightly=
            failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly_windows.yml/runs?head_sha=$GITHUB_SHA&status=failure" --jq .total_count)
            if [ "$nightly" = "$GITHUB_SHA" ]; then
              echo "The nightly release is $GITHUB_SHA already."
              build=false
            elif [ "$failed" != 0 ]; then
              echo "$GITHUB_SHA failed to build before; it is not tried again."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  windows:
    name: Build, package and publish
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # build.sh installs the packages it needs, from .ci/dependencies_msys.txt,
      # and, under CI, empties pacman's package cache after, so there is none
      # to keep.
      - name: Prepare MSYS2 environment
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 #v2.32.0
        with:
          release: true
          update: true
          cache: false
          msystem: UCRT64
          install: git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the build
        id: name
        run: |
          ver=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          date=$(date -u +%Y%m%d)
          hash=${GITHUB_SHA:0:9}
          test -n "$ver"
          {
            echo "ver=$ver"
            echo "date=$date"
            echo "hash=$hash"
            echo "base=86Box-smp-Windows-64-$date-$hash"
          } >> "$GITHUB_OUTPUT"

      # build.sh packs the Ghostscript DLL of the official installation in
      # Program Files, as upstream's build machines have it. Only that DLL is
      # used, so it is unpacked from the official installer to where the
      # installer puts it; running the installer hung the step.
      - name: Unpack Ghostscript
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = "$env:RUNNER_TEMP\gs10080w64.exe"
          Invoke-WebRequest https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/gs10080w64.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '52A91B8BF09298788D7A57B9206127026C23EACD75405F0A131E26DC381DCE50') {
            throw "the Ghostscript download is not the one expected"
          }
          $bin = "$env:ProgramFiles\gs\gs10.08.0\bin"
          & "$env:ProgramFiles\7-Zip\7z.exe" e -y "-o$bin" $setup 'bin\gsdll64.dll'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash "$bin\gsdll64.dll" -Algorithm SHA256).Hash -ne 'A134ED0D3AF749BDAB93C66029180E676D36D9CC624C192EA287F73C891FB0AF') {
            throw "gsdll64.dll is not the one expected"
          }

      # Upstream's release build, as its Jenkinsfile runs it for a Regular
      # Windows x64 build: librashader linked in, mdsx, libaaruformat and the
      # Ghostscript DLL beside the stripped exe, in archive_tmp. build.sh
      # fetches mdsx (and assets, for release builds only) from the owner of
      # the origin remote, which is upstream's for these.
      - name: Build with upstream's build script
        timeout-minutes: 100
        run: |
          git config --global --add safe.directory "$(pwd)"
          git remote set-url origin https://github.com/86Box/86Box.git
          .ci/build.sh -n -b "${{ steps.name.outputs.base }}" 64 -t --preset=regular -D CMAKE_BUILD_TYPE=Release \
            -D DYNAREC=ON -D QT=ON -D BUILD_TYPE=alpha -D "EMU_BUILD=nightly ${{ steps.name.outputs.date }}"

      # Upstream adds the assets (drive sounds, fonts) to release builds
      # only; these builds are for trying out, so they get them too.
      - name: Add the assets
        run: |
          git clone --depth 1 https://github.com/86Box/assets.git archive_tmp/assets
          rm -rf archive_tmp/assets/.git archive_tmp/assets/.github archive_tmp/assets/.gitignore
          find archive_tmp/assets -maxdepth 1 -type f -delete

      # 86Box's PCL printer converts with GhostPCL, which upstream does not pack.
      - name: Add GhostPCL
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ghostpcl.zip"
          Invoke-WebRequest https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10080/ghostpcl-10.08.0-win64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'E3950C0B21ED687F0609AC5A6EC0DA57ECB5160FB2F68832E3E9309A0B3491C7') {
            throw "the GhostPCL download is not the one expected"
          }
          Expand-Archive $zip "$env:RUNNER_TEMP\ghostpcl"
          Copy-Item "$env:RUNNER_TEMP\ghostpcl\ghostpcl-10.08.0-win64\gpcl6dll64.dll" archive_tmp\

      - name: Check the package
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Depth 1 archive_tmp | Format-Table -AutoSize Length, FullName
          foreach ($p in '86Box.exe', 'gsdll64.dll', 'gpcl6dll64.dll', 'mdsx.dll', 'libaaruformat.dll', 'assets\sounds', 'assets\fonts') {
            if (-not (Test-Path "archive_tmp\$p")) { throw "the package has no $p" }
          }
          # librashader is linked into the exe; CMake fails when it cannot find it.
          $cache = Get-Content build\CMakeCache.txt
          foreach ($v in 'LIBRASHADER', 'LIBRASHADER_STATIC') {
            if (-not ($cache -match "^${v}:[A-Z]+=ON$")) { throw "the build was not made with $v on" }
          }
          if (-not ($cache -match '^LIBRASHADER_STATIC_LIB:FILEPATH=.*liblibrashader_capi\.a$')) { throw "the build did not link librashader" }

      - name: Package the zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location archive_tmp
          & "$env:ProgramFiles\7-Zip\7z.exe" a -y "$env:GITHUB_WORKSPACE\out\${{ steps.name.outputs.base }}.zip" *
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }

      # A version of our own, not the runner image's, which changes under us.
      - name: Install Inno Setup
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') {
            throw "the Inno Setup download is not the one expected"
          }
          $p = Start-Process -Wait -PassThru $setup `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$env:RUNNER_TEMP\inno`""
          if ($p.ExitCode -ne 0) { throw "Inno Setup's setup exited with $($p.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp `
            "/DAppVer=${{ steps.name.outputs.ver }}" `
            "/DBuildDate=${{ steps.name.outputs.date }}" `
            "/DGitHash=${{ steps.name.outputs.hash }}" `
            "/DSrcDir=$env:GITHUB_WORKSPACE\archive_tmp" `
            "/DOutDir=$env:GITHUB_WORKSPACE\out" `
            "/DOutName=${{ steps.name.outputs.base }}-setup" `
            .github\installer\86box-smp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the installer
        shell: pwsh
        timeout-minutes: 20
        run: |
          $dir = "$env:RUNNER_TEMP\smoke"
          $log = "$env:RUNNER_TEMP\setup.log"
          $setup = Start-Process -Wait -PassThru "out\${{ steps.name.outputs.base }}-setup.exe" `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"", "/LOG=`"$log`""
          Get-Content $log
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          foreach ($p in '86Box.exe', 'COPYING', 'gsdll64.dll', 'gpcl6dll64.dll', 'mdsx.dll', 'libaaruformat.dll',
                         'assets\sounds', 'assets\fonts', 'roms\roms.version', 'roms\machines') {
            if (-not (Test-Path "$dir\$p")) { throw "setup did not install $p" }
          }
          if (Test-Path "$dir\roms\.github") { throw "setup installed the ROM repository's .github" }
          Write-Host "ROMs: $(Get-Content "$dir\roms\roms.version")"
          # The uninstaller hands over to a copy of itself and returns at once.
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = (Get-Date).AddMinutes(5)
          while (Test-Path "$dir\86Box.exe") {
            if ((Get-Date) -gt $deadline) { throw "uninstall did not finish" }
            Start-Sleep -Seconds 2
          }
          if (Test-Path "$dir\roms") { throw "uninstall left the ROMs" }

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()) *$($_.Name)"
          } | Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - name: Keep the files with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.base }}
          path: out/*
          retention-days: 7

      - name: Publish the nightly release
        if: github.event_name == 'schedule' || inputs.publish
        shell: bash
        run: |
          repo=$GITHUB_REPOSITORY
          prev=$(gh api "repos/$repo/commits/nightly" --jq .sha 2>/dev/null) || prev=
          {
            echo "Nightly Windows x64 build of master at ${GITHUB_SHA:0:9}, made by GitHub Actions with upstream's release build script."
            echo
            echo "These builds are not run through the CPU and game test suites before they are published."
            echo
            echo "- \`${{ steps.name.outputs.base }}-setup.exe\`: installer, ready to run. It downloads the latest ROMs from [Hinoserm/86box-roms](https://github.com/Hinoserm/86box-roms) as it installs, and skips the download when they have not changed."
            echo "- \`${{ steps.name.outputs.base }}.zip\`: the same build without an installer. Put the ROMs from [Hinoserm/86box-roms](https://github.com/Hinoserm/86box-roms) in a \`roms\` folder next to \`86Box.exe\`."
            echo "- \`SHA256SUMS.txt\`: checksums of both."
            echo
            echo "Both hold everything upstream's own Windows builds do: video shaders (librashader), MDS/MDX and Aaru images (mdsx, libaaruformat), and printing to PDF (Ghostscript); and more: PCL printing (GhostPCL) and the drive sounds and fonts of [86Box/assets](https://github.com/86Box/assets)."
            echo
            echo "Windows 10 or later, x64. Networking through a host adapter (pcap) needs [Npcap](https://npcap.com/), which may not be redistributed. Ghostscript and GhostPCL are Artifex's official 10.08.0 builds, under the AGPL; their source is at [ArtifexSoftware/ghostpdl](https://github.com/ArtifexSoftware/ghostpdl)."
            if [ -n "$prev" ] && [ "$prev" != "$GITHUB_SHA" ]; then
              echo
              echo "Changes since the previous nightly (${prev:0:9}):"
              echo
              gh api "repos/$repo/compare/$prev...$GITHUB_SHA" \
                --jq '.commits | reverse | .[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"' \
                || echo "- (the list of changes could not be made)"
            fi
          } > notes.md
          gh release delete nightly --repo "$repo" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$repo/git/refs/tags/nightly" 2>/dev/null || true
          gh release create nightly --repo "$repo" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly ${{ steps.name.outputs.date }} (${{ steps.name.outputs.hash }})" \
            --notes-file notes.md out/*
